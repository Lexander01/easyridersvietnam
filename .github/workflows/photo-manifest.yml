name: Regenerate photo manifest

on:
  push:
    paths:
      - "photos/**"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate photo-manifest.js
        run: python3 scripts/generate_photo_manifest.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet photo-manifest.js; then
            echo "photo-manifest.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photo-manifest.js
          git commit -m "Regenerate photo manifest"
          git push
